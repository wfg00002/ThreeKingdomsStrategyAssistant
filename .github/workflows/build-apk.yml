# .github/workflows/build-apk.yml
# 三战助手 APK 自动构建工作流
#
# 触发方式：
#   1. push 到 main 分支 → 自动构建 debug APK
#   2. workflow_dispatch → 在 GitHub Actions 页面手动触发
#
# 产物：使用 upload-artifact 上传 debug APK，可在工作流运行页面下载
#
# 说明：使用 gradle/actions/setup-gradle 直接调用 gradle，无需 gradlew 二进制 wrapper jar，
# 方便手机端直接上传源码即可构建。
name: Build Debug APK
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # 允许在 Actions 页面手动触发
 
jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
 
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
 
      # 2. 配置 JDK 17（与项目 compileOptions 一致）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
 
      # 3. 配置 Gradle（直接使用 gradle 命令，无需 gradlew wrapper jar）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
 
      # 4. 配置 Android SDK（默认安装 cmdline-tools 并接受许可，
      #    Gradle 构建时会按需自动下载 platform-34 / build-tools 34.0.0）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
 
      # 5. 缓存 Gradle 依赖（加速后续构建）
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
 
      # 6. 构建 debug APK（直接调用 gradle 命令）
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
 
      # 7. 上传 APK 产物（在工作流页面可下载，保留 30 天）
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: three-camp-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
 
      # 8. 输出构建摘要
      - name: Build summary
        if: always()
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- 提交：${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- 分支：${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 触发：${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 产物：app/build/outputs/apk/debug/*.apk" >> $GITHUB_STEP_SUMMARY
