name: Build Android Debug APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1"
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 自动生成 gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: 给gradlew添加执行权限
        run: chmod +x ./gradlew

      - name: 编译Debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
