# gradle/libs.versions.toml
# 版本目录文件，集中管理依赖版本，便于维护
[versions]
4 lines hidden
activityCompose = "1.9.1"
composeBom = "2024.06.00"
mlkitTextChinese = "16.0.1"                  # ML Kit 中文文字识别（离线模型）
mlkitTextLatin = "16.0.1"                     # ML Kit Latin 基础（中文依赖它）
workManager = "2.9.0"
coroutines = "1.8.1"                         # Kotlin 协程（launch/delay/withContext/suspendCancellableCoroutine）
 
[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
7 lines hidden
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# ML Kit 中文 OCR（自动下载离线模型，运行期不联网识别）
mlkit-text-chinese = { group = "com.google.mlkit", name = "text-recognition-chinese", version.ref = "mlkitTextChinese" }
mlkit-text-latin = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextLatin" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
# Kotlin 协程：代码里大量使用 launch/delay/withContext/suspendCancellableCoroutine/Dispatchers
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
 
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
